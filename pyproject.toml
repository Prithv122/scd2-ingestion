[project]
name = "scd2-ingestion"
version = "0.1.0"
description = "Incremental, idempotent SCD Type 2 dimension ingestion that correctly handles late-arriving and out-of-order change events, with a randomized order-independence proof."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
]

# Most projects here ship a CLI. Entry points REQUIRE a real build backend —
# a uv virtual project ([tool.uv] package = false) installs nothing, so the
# documented command fails with "No module named ..." even while tests pass
# (pytest's pythonpath hides it). Bit us on A1, nearly again on A3.
# No-CLI projects (static sites, notebooks-only): delete [project.scripts];
# the build backend is harmless to keep.
[project.scripts]
scd2-ingestion = "scd2_ingestion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ⚠️ When /new-project renames src/app, update BOTH the line below AND the
# [project.scripts] target above.
[tool.hatch.build.targets.wheel]
packages = ["src/scd2_ingestion"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
